name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m venv coa_mapper/.venv
          coa_mapper/.venv/bin/pip install -q --upgrade pip
          coa_mapper/.venv/bin/pip install -q -e "coa_mapper[dev,lint]"

      - name: Lint (ruff, black --check, mypy)
        run: make lint

      - name: Tests
        run: make test

      - name: Committed output/ reproduces byte-for-byte
        run: make reproduce

      - name: Coverage
        run: |
          cd coa_mapper
          .venv/bin/python -m pytest tests/ -q \
            --cov=coa_mapper --cov-report=term-missing --cov-fail-under=95
