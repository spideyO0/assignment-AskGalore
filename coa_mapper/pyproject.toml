[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coa-mapper"
version = "1.0.0"
description = "Deterministic TB-to-COA mapper with confidence gating, audit trail, and failure reconciliation"
requires-python = ">=3.11"
dependencies = [
    "rapidfuzz>=3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "pytest-cov>=5.0",
]
lint = [
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
coa-mapper = "coa_mapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short"]
markers = [
    "golden: byte-for-byte artifact comparison against tests/golden/",
    "property: hypothesis-generated adversarial inputs",
    "contract: exit-code and failure-path guarantees",
]

# ============================================================================
# Tooling: black + isort + ruff + mypy, pytest with
# strict markers so a typo in a marker fails the run instead of silently
# selecting nothing, and branch coverage.
# ============================================================================

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["coa_mapper"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C4", "B", "UP", "SIM", "RET", "ARG"]
ignore = [
    "E501",  # line length is black's job
    "B008",  # calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E501", "ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
packages = ["coa_mapper"]
mypy_path = "src"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["rapidfuzz.*", "yaml.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/coa_mapper"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
